version: "3.9"

services:
  geoserver:
    image: geoserver:latest
    container_name: my-geoserver
    ports:
      - "8080:8080"
    environment:
      # OPTIONAL: Set admin user/password if you like
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    # If you have data_dir you want to persist or customize:
    # volumes:
    #   - ./geoserver_data:/var/local/geoserver

  frontend:
    container_name: my-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
